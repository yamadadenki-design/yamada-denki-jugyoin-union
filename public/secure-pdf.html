<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>限定公開PDF</title><style>body{margin:0;font-family:system-ui;background:#f1f5fa}header{padding:12px;background:#163c6b;color:white}a{color:white}#view{width:100%;height:calc(100vh - 56px);border:0}#status{padding:20px}</style><header><a href="/restricted/">事件記録アーカイブへ戻る</a>　PDFは１ページ目から表示</header><p id="status">PDFを準備しています…</p><iframe id="view" title="PDF資料" hidden></iframe><script type="module">
(async()=>{let id=new URL(location.href).searchParams.get('doc');if(!/^\d{2}$/.test(id||'')){document.getElementById('status').textContent='PDF番号が正しくありません';return}try{const r=await fetch('/.netlify/functions/archive-key',{cache:'no-store'});if(!r.ok){location.replace('/restricted/');return}const {key}=await r.json();const fr=await fetch('/encrypted/'+id+'.bin');if(!fr.ok)throw Error('資料が見つかりません');const b=new Uint8Array(await fr.arrayBuffer());const k=await crypto.subtle.importKey('raw',Uint8Array.from(atob(key),c=>c.charCodeAt(0)),{name:'AES-GCM'},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12));const u=URL.createObjectURL(new Blob([clear],{type:'application/pdf'}));let v=document.getElementById('view');v.src=u+'#page=1';v.hidden=false;document.getElementById('status').remove();}catch(e){document.getElementById('status').textContent='PDFの読み込みに失敗しました。再度ログインしてお試しください。'}})();</script></html>
