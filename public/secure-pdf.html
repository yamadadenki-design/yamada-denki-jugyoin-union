<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>限定公開PDF</title><style>body{margin:0;font-family:system-ui;background:#f1f5fa}header{padding:12px;background:#163c6b;color:white}#mobileActions{display:none;padding:12px 16px;background:#fff;color:#142f50;line-height:1.7}#mobileActions a{display:inline-block;margin:5px 10px 5px 0;padding:10px 14px;border-radius:7px;background:#245b9e;color:white;text-decoration:none}#mobileActions small{display:block;color:#364d63}a{color:white}#view{width:100%;height:calc(100vh - 56px);border:0}#status{padding:20px}</style><header><a href="/restricted/">事件記録アーカイブへ戻る</a>　PDFは１ページ目から表示</header><section id="mobileActions"><strong>スマートフォンで２ページ目以降に進めない場合</strong><div><a id="downloadPdf" href="#" download="限定公開資料.pdf">PDFを保存して開く</a><a id="openPdf" href="#" target="_blank" rel="noopener">PDFを別タブで開く</a></div><small>保存したPDFはスマートフォンの「ファイル」や「ダウンロード」から開いてください。資料には個人情報が含まれる場合がありますので、共有せず安全に管理してください。</small></section><p id="status">PDFを準備しています…</p><iframe id="view" title="PDF資料" hidden></iframe><script type="module">
(async()=>{let id=new URL(location.href).searchParams.get('doc');if(!/^\d{2}$/.test(id||'')){document.getElementById('status').textContent='PDF番号が正しくありません';return}try{const r=await fetch('/.netlify/functions/archive-key',{cache:'no-store'});if(!r.ok){location.replace('/restricted/');return}const {key}=await r.json();const fr=await fetch('/encrypted/'+id+'.bin');if(!fr.ok)throw Error('資料が見つかりません');const b=new Uint8Array(await fr.arrayBuffer());const k=await crypto.subtle.importKey('raw',Uint8Array.from(atob(key),c=>c.charCodeAt(0)),{name:'AES-GCM'},false,['decrypt']);const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12));const u=URL.createObjectURL(new Blob([clear],{type:'application/pdf'}));let v=document.getElementById('view');v.src=u+'#page=1';v.hidden=false;document.getElementById('downloadPdf').href=u;document.getElementById('downloadPdf').download='限定公開資料_'+id+'.pdf';document.getElementById('openPdf').href=u;document.getElementById('mobileActions').style.display='block';document.getElementById('status').remove();}catch(e){document.getElementById('status').textContent='PDFの読み込みに失敗しました。再度ログインしてお試しください。'}})();</script></html>
