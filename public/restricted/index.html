<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>限定公開 | ヤマダデンキ従業員組合</title><style>body{margin:0;background:linear-gradient(125deg,#102d50,#275f9f);font-family:system-ui,sans-serif}#gate{background:white;max-width:500px;margin:10vh auto;padding:36px;border-radius:22px;box-shadow:0 8px 40px #0003}h1{color:#183a68}input{font-size:20px;padding:12px;max-width:80%;border:1px solid #889dbb;border-radius:6px}button{background:#245b9e;color:white;border:0;padding:14px 20px;border-radius:7px;cursor:pointer}#archive{display:none;width:100%;height:100vh;border:0;background:white}#status{color:#9b2333}a{color:#245b9e}</style><div id="gate"><h1>限定公開ホームページ</h1><p>FAX記載の７桁のパスワードを入力してください。</p><form id="login"><input id="password" type="password" inputmode="numeric" maxlength="7" required autocomplete="off"><button>閲覧する</button></form><p id="status" role="status"></p><p><a href="/">トップページへ戻る</a></p></div><iframe id="archive" title="事件記録アーカイブ"></iframe><script type="module">
async function decrypt(path,key){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('資料の読み込みに失敗しました');const b=new Uint8Array(await r.arrayBuffer());const cryptoKey=await crypto.subtle.importKey('raw',Uint8Array.from(atob(key),c=>c.charCodeAt(0)),{name:'AES-GCM'},false,['decrypt']);return await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},cryptoKey,b.slice(12))}
async function show(){const r=await fetch('/.netlify/functions/archive-key',{cache:'no-store'});if(!r.ok)return false;const {key}=await r.json();const bytes=await decrypt('/encrypted/archive.bin',key);const html=new TextDecoder().decode(bytes);const revised=html.replace(/本ページは構成確認のための仮ホームページです。\s*文章・掲載順・資料名・公開範囲は、今後の確認により修正します。/g,'本ページには、労働条件や労働組合に関する資料を掲載しています。');const frame=document.getElementById('archive');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  if(!doc)return;
  doc.addEventListener('click',event=>{
    const el=event.target instanceof Element ? event.target : event.target.parentElement;
    const link=el?.closest('a[href^="#"]');
    if(!link)return;
    const hash=link.getAttribute('href').slice(1);
    if(!hash)return;
    let id;try{id=decodeURIComponent(hash)}catch{return}
    const target=doc.getElementById(id) || doc.querySelector('[name="'+CSS.escape(id)+'"]');
    if(target){event.preventDefault();target.scrollIntoView({block:'start',behavior:'auto'});}
  });
},{once:true});
frame.srcdoc=revised;
document.getElementById('archive').style.display='block';document.getElementById('gate').style.display='none';document.body.style.background='white';return true}
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='確認中…';const password=document.getElementById('password').value;document.getElementById('password').value='';try{const r=await fetch('/.netlify/functions/archive-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});if(!r.ok){status.textContent='パスワードが違うか、しばらく利用できません。';return}if(!(await show()))throw Error('認証を確認できません');}catch(e){status.textContent='通信エラー。時間をおいて再度お試しください。'}};
show().catch(()=>{});
</script></html>
